<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maddy's Do-Re-Mi Trainer</title><style>
:root{
  --ink:#302b3d;
  --muted:#7b7488;
  --purple:#7357d9;
  --purple-dark:#5d43bc;
  --lavender:#eee9ff;
  --peach:#ffe6dc;
  --mint:#dcf4e6;
  --rose:#ffdede;
  --paper:#fffdfb;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 8%, #eee8ff 0 9%, transparent 24%),
    radial-gradient(circle at 94% 15%, #ffe9df 0 8%, transparent 23%),
    linear-gradient(145deg,#f8f6ff,#fffaf6);
  -webkit-tap-highlight-color:transparent;
}
.app{width:min(760px,100%);margin:auto;padding:22px 16px 28px}
h1{
  text-align:center;
  font-size:clamp(27px,6vw,36px);
  line-height:1.12;
  margin:3px 0 16px;
  letter-spacing:-.7px;
  color:#332c47;
}
h1::before{content:"♪  ";color:var(--purple)}
h1::after{content:"  ♫";color:#f08a68}
.panel{
  position:relative;
  background:rgba(255,253,251,.94);
  border:2px solid rgba(115,87,217,.12);
  border-radius:28px;
  padding:17px;
  box-shadow:0 14px 38px rgba(73,55,126,.12);
  overflow:hidden;
}
.panel::before{
  content:"";
  position:absolute;
  width:130px;height:130px;
  right:-70px;top:-70px;
  border-radius:50%;
  background:var(--lavender);
  opacity:.7;
}
.stats{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:center;
  gap:10px;
  margin:0 0 13px;
}
.stat{
  min-width:105px;
  background:#f5f2ff;
  border:1px solid #e5defd;
  border-radius:17px;
  padding:8px 13px 7px;
  text-align:center;
}
.stat:nth-child(2){background:#fff3ee;border-color:#ffe2d7}
.stat:nth-child(3){background:#eef9f2;border-color:#d9f0e1}
.stat b{
  display:block;
  font-size:23px;
  line-height:1.05;
  color:#4b3c78;
}
.stat small{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.progress{
  position:relative;
  height:9px;
  background:#eeeaf5;
  border-radius:99px;
  overflow:hidden;
  margin:2px 3px 14px;
}
.fill{
  height:100%;
  width:0;
  border-radius:99px;
  background:linear-gradient(90deg,#8065e5,#f28c72);
  transition:width .3s ease;
}
.note-card{
  position:relative;
  border:2px solid #e7e1ef;
  border-radius:20px;
  background:white;
  padding:0;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(60,45,90,.06);
}
.note-card img{display:block;width:100%;height:auto}
.prompt{
  text-align:center;
  font-size:21px;
  font-weight:800;
  margin:14px 0 11px;
  color:#393147;
}
.answers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
button{
  border:0;
  border-radius:16px;
  padding:14px 8px;
  font-size:18px;
  font-weight:800;
  color:#3e3651;
  background:#f0edf7;
  box-shadow:inset 0 -2px 0 rgba(70,55,100,.08);
  touch-action:manipulation;
  transition:transform .08s,background .15s,box-shadow .15s;
}
.answers button{
  background:linear-gradient(#f7f5fb,#eeeaf7);
  border:1px solid #e1dced;
}
button:active{transform:translateY(1px) scale(.98)}
button:disabled{opacity:1}
.answers button.correct{
  background:var(--mint);
  border-color:#bfe5cc;
  color:#287044;
}
.answers button.wrong{
  background:var(--rose);
  border-color:#f2c4c4;
  color:#a13e3e;
}
.feedback{
  text-align:center;
  min-height:34px;
  font-size:18px;
  font-weight:750;
  padding:9px 0 5px;
  color:#4a4257;
}
.next{
  width:100%;
  margin-top:3px;
  color:white;
  background:linear-gradient(135deg,var(--purple),#9279ea);
  box-shadow:0 5px 12px rgba(115,87,217,.22);
}
.reset{
  display:block;
  margin:10px auto 0;
  background:transparent;
  box-shadow:none;
  color:#918a9c;
  font-size:12px;
  font-weight:600;
  padding:5px 8px;
}
@media(max-width:560px){
  .app{padding:15px 10px 22px}
  .panel{padding:12px;border-radius:23px}
  .stats{gap:6px}
  .stat{min-width:0;flex:1;padding:8px 5px}
  .stat b{font-size:21px}
  .answers{grid-template-columns:repeat(2,1fr);gap:9px}
}

.mnemonic{
  margin-top:4px;
  color:#7357d9;
  font-size:17px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(!s)return;state.streak=s.streak||0;state.correct=s.correct||0;state.total=s.total||0;if(s.skill)state.skill=s.skill;if(s.misses)state.misses=s.misses;if(s.fast)state.fast=s.fast}catch(e){}}load();function cards(){const a=[];for(const staff of ["treble","bass"])for(let i=0;i<7;i++)a.push({staff,i});return a}function choose(){const a=cards(),w=a.map(c=>1+state.misses[c.staff][c.i]*5+Math.max(0,4-state.skill[c.staff][c.i])*2+Math.max(0,4-state.fast[c.staff][c.i])*2);let r=Math.random()*w.reduce((x,y)=>x+y,0);for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}return a[0]}function renderStats(){document.getElementById("streak").textContent=state.streak;document.getElementById("accuracy").textContent=state.total?Math.round(state.correct/state.total*100)+"%":"—";let m=0;for(const s of ["treble","bass"])for(let i=0;i<7;i++)if(state.skill[s][i]>=4&&state.fast[s][i]>=4)m++;document.getElementById("mastered").textContent=m+"/14";document.getElementById("fill").style.width=(m/14*100)+"%"}function next(){state.current=choose();const s=state.current.staff,n=SOL[state.current.i];document.getElementById("staff").innerHTML='<img alt="Music staff note" src="data:image/png;base64,'+IMG[s+"_"+n]+'">';const choices=[...SOL];for(let j=choices.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[choices[j],choices[k]]=[choices[k],choices[j]]}document.getElementById("answers").innerHTML=choices.map(n=>`<button type="button" data-answer="${n}">${n}</button>`).join("");document.querySelectorAll("#answers button").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.answer)));document.getElementById("feedback").textContent="";document.getElementById("next").style.display="none";state.startedAt=performance.now();renderStats()}
let audioCtx = null;
function playNote(staff, noteIndex){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  if(!audioCtx) audioCtx = new AC();
  if(audioCtx.state === "suspended") audioCtx.resume();

  // Treble Do–Ti = C4–B4; Bass Do–Ti = C3–B3.
  const midi = (staff === "treble" ? 60 : 48) + noteIndex;
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  const now = audioCtx.currentTime;

  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(0.24, now + 0.012);
  master.gain.exponentialRampToValueAtTime(0.09, now + 0.18);
  master.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);
  master.connect(audioCtx.destination);

  [[1,0.85],[2,0.18],[3,0.07],[4,0.03]].forEach(([multiple, level])=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.value=freq*multiple;
    gain.gain.value=level;
    osc.connect(gain);
    gain.connect(master);
    osc.start(now);
    osc.stop(now+1.0);
  });
}

function answer(given){const target=SOL[state.current.i],buttons=[...document.querySelectorAll("#answers button")];buttons.forEach(b=>b.disabled=true);state.total++;const ms=performance.now()-state.startedAt;if(given===target){state.correct++;state.streak++;playNote(state.current.staff,state.current.i);state.skill[state.current.staff][state.current.i]=Math.min(4,state.skill[state.current.staff][state.current.i]+1);if(ms<=FAST_LIMIT)state.fast[state.current.staff][state.current.i]=Math.min(4,state.fast[state.current.staff][state.current.i]+1);else state.fast[state.current.staff][state.current.i]=Math.max(0,state.fast[state.current.staff][state.current.i]-1);document.getElementById("feedback").innerHTML='<div>✓ <b>'+target+'</b>!</div><div class="mnemonic">'+MNEMONIC[state.current.staff][state.current.i]+'</div>'}else{state.streak=0;state.misses[state.current.staff][state.current.i]++;state.skill[state.current.staff][state.current.i]=Math.max(0,state.skill[state.current.staff][state.current.i]-1);state.fast[state.current.staff][state.current.i]=0;document.getElementById("feedback").innerHTML="Not quite — it was <b>"+target+"</b>."}buttons.forEach(b=>{if(b.dataset.answer===target)b.classList.add("correct");if(b.dataset.answer===given&&given!==target)b.classList.add("wrong")});document.getElementById("next").style.display="block";save();renderStats()}document.getElementById("next").addEventListener("click",next);document.getElementById("reset").addEventListener("click",()=>{if(confirm("Reset Maddy's practice progress?")){localStorage.removeItem(STORAGE_KEY);state.streak=state.correct=state.total=0;state.skill={treble:Array(7).fill(0),bass:Array(7).fill(0)};state.misses={treble:Array(7).fill(0),bass:Array(7).fill(0)};state.fast={treble:Array(7).fill(0),bass:Array(7).fill(0)};next()}});next();</script></body></html>
