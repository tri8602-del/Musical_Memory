<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maddy's Do-Re-Mi Trainer</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f5f4f1;color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent
}
.app{width:min(760px,100%);margin:auto;padding:14px}
h1{font-size:29px;line-height:1.15;margin:4px 0 14px;text-align:center}
.panel{
  background:white;border-radius:22px;padding:15px;
  box-shadow:0 4px 18px #00000012
}
.stats{display:flex;justify-content:center;gap:28px;margin:0 0 10px}
.stat{text-align:center}.stat b{display:block;font-size:22px}.stat small{color:#777}
.progress{height:7px;background:#e7e7e7;border-radius:20px;overflow:hidden;margin:2px 2px 12px}
.fill{height:100%;width:0;background:#f28c28;transition:width .25s}
.staff{
  border:1px solid #ddd;border-radius:17px;background:#fff;
  padding:5px 4px 2px
}
svg{display:block;width:100%;height:auto}
.prompt{text-align:center;font-size:20px;font-weight:700;margin:13px 0 11px}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
button{
  border:0;border-radius:14px;padding:14px 8px;font-size:18px;
  font-weight:700;background:#e9e9e9;touch-action:manipulation
}
button:active{transform:scale(.97)}
button:disabled{opacity:1}
.answers button.correct{background:#cde7cf;color:#285d2a}
.answers button.wrong{background:#f2cfcc;color:#8a2922}
.feedback{text-align:center;min-height:30px;font-size:18px;font-weight:700;padding:9px 0 5px}
.next{width:100%;background:#222;color:white;margin-top:3px}
@media(max-width:500px){
  .answers{grid-template-columns:repeat(2,1fr)}
  .stats{gap:22px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🎹 Maddy's Do-Re-Mi Trainer</h1>

  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="streak">0</b><small>streak</small></div>
      <div class="stat"><b id="accuracy">—</b><small>accuracy</small></div>
      <div class="stat"><b id="mastered">0/14</b><small>mastered</small></div>
    </div>

    <div class="progress"><div class="fill" id="fill"></div></div>

    <div class="staff" id="staff"></div>

    <div class="prompt">What is it?</div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next" style="display:none">Next note →</button>
  </div>
</div>

<script>
"use strict";

const SOL = ["Do","Re","Mi","Fa","Sol","La","Ti"];
const state = {
  current:null, streak:0, correct:0, total:0,
  skill:{treble:Array(7).fill(0),bass:Array(7).fill(0)},
  misses:{treble:Array(7).fill(0),bass:Array(7).fill(0)}
};

function cards(){
  const a=[];
  for(const staff of ["treble","bass"])
    for(let i=0;i<7;i++) a.push({staff,i});
  return a;
}

function choose(){
  const a=cards();
  const w=a.map(c=>1+state.misses[c.staff][c.i]*5+Math.max(0,4-state.skill[c.staff][c.i])*2);
  let r=Math.random()*w.reduce((x,y)=>x+y,0);
  for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}
  return a[0];
}

/*
  True grand staff:
  - treble staff on top
  - bass staff below
  - visible gap between the two staffs
  - clefs placed at the left of their own staff
  - only ONE note is highlighted/played at a time
*/
function staffSvg(staff,i){
  const treble=[48,60,72,84,96];
  const bass=[119,131,143,155,167];

  // Solfège positions used by the supplied flashcards:
  // Treble: Do below the staff, Re below the staff, Mi bottom line,
  //         Fa first space, Sol second line, La second space, Ti third line.
  // Bass:   Do second space from bottom, Re third line, Mi third space,
  //         Fa fourth line, Sol top line, La above, Ti above.
  const trebleY = 96-(i-2)*6;
  const bassY   = 119+(4-i)*6;
  const y = staff==="treble" ? trebleY : bassY;

  const lineSvg = ys => ys.map(v =>
    `<line x1="145" y1="${v}" x2="685" y2="${v}" stroke="#222" stroke-width="2"/>`
  ).join("");

  let ledger="";
  if(staff==="treble" && i<2) ledger=`<line x1="124" y1="${y}" x2="166" y2="${y}" stroke="#222" stroke-width="2"/>`;
  if(staff==="bass" && i>4) ledger=`<line x1="124" y1="${y}" x2="166" y2="${y}" stroke="#222" stroke-width="2"/>`;

  const note = `
    <ellipse cx="370" cy="${y}" rx="15" ry="10" fill="#222" transform="rotate(-18 370 ${y})"/>
    ${staff==="treble"
      ? `<line x1="384" y1="${y}" x2="384" y2="${y-45}" stroke="#222" stroke-width="3"/>`
      : `<line x1="356" y1="${y}" x2="356" y2="${y+45}" stroke="#222" stroke-width="3"/>`
    }`;

  return `<svg viewBox="0 0 720 205" aria-label="Grand staff">
    ${lineSvg(treble)}
    ${lineSvg(bass)}

    <!-- Treble clef -->
    <text x="65" y="91" font-size="78" font-family="serif">𝄞</text>

    <!-- Bass clef -->
    <text x="65" y="164" font-size="72" font-family="serif">𝄢</text>

    ${ledger}
    ${note}

    <!-- Subtle brace -->
    <path d="M42 40 C28 45 28 72 42 103 C28 134 28 163 42 170"
          fill="none" stroke="#444" stroke-width="2.5"/>
  </svg>`;
}

function renderStats(){
  document.getElementById("streak").textContent=state.streak;
  document.getElementById("accuracy").textContent=state.total
    ? Math.round(state.correct/state.total*100)+"%" : "—";

  let mastered=0;
  for(const staff of ["treble","bass"])
    for(const v of state.skill[staff]) if(v>=4) mastered++;

  document.getElementById("mastered").textContent=mastered+"/14";
  document.getElementById("fill").style.width=(mastered/14*100)+"%";
}

function next(){
  state.current=choose();
  document.getElementById("staff").innerHTML=staffSvg(
    state.current.staff,state.current.i
  );

  document.getElementById("answers").innerHTML=SOL.map(
    n=>`<button type="button" data-answer="${n}">${n}</button>`
  ).join("");

  document.querySelectorAll("#answers button").forEach(btn=>{
    btn.addEventListener("click",()=>answer(btn.dataset.answer));
  });

  document.getElementById("feedback").textContent="";
  document.getElementById("next").style.display="none";
  renderStats();
}

function answer(given){
  const target=SOL[state.current.i];
  const buttons=[...document.querySelectorAll("#answers button")];
  buttons.forEach(b=>b.disabled=true);

  state.total++;

  if(given===target){
    state.correct++;
    state.streak++;
    state.skill[state.current.staff][state.current.i]=Math.min(
      4,state.skill[state.current.staff][state.current.i]+1
    );
    document.getElementById("feedback").innerHTML=`✓ <b>${target}</b>!`;
  }else{
    state.streak=0;
    state.misses[state.current.staff][state.current.i]++;
    state.skill[state.current.staff][state.current.i]=Math.max(
      0,state.skill[state.current.staff][state.current.i]-1
    );
    document.getElementById("feedback").innerHTML=
      `Not quite — it was <b>${target}</b>.`;
  }

  buttons.forEach(b=>{
    if(b.dataset.answer===target)b.classList.add("correct");
    if(b.dataset.answer===given && given!==target)b.classList.add("wrong");
  });

  document.getElementById("next").style.display="block";
  renderStats();
}

document.getElementById("next").addEventListener("click",next);
next();
</script>
</body>
</html>
