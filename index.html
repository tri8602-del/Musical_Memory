<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maddy's Do-Re-Mi Trainer</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f5f4f1;color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent
}
.app{width:min(760px,100%);margin:auto;padding:14px}
h1{font-size:29px;line-height:1.15;margin:4px 0 14px;text-align:center}
.panel{
  background:white;border-radius:22px;padding:15px;
  box-shadow:0 4px 18px #00000012
}
.stats{display:flex;justify-content:center;gap:28px;margin:0 0 10px}
.stat{text-align:center}.stat b{display:block;font-size:22px}.stat small{color:#777}
.progress{height:7px;background:#e7e7e7;border-radius:20px;overflow:hidden;margin:2px 2px 12px}
.fill{height:100%;width:0;background:#f28c28;transition:width .25s}
.staff{
  border:1px solid #ddd;border-radius:17px;background:#fff;
  padding:5px 4px 2px
}
svg{display:block;width:100%;height:auto}
.prompt{text-align:center;font-size:20px;font-weight:700;margin:13px 0 11px}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
button{
  border:0;border-radius:14px;padding:14px 8px;font-size:18px;
  font-weight:700;background:#e9e9e9;touch-action:manipulation
}
button:active{transform:scale(.97)}
button:disabled{opacity:1}
.answers button.correct{background:#cde7cf;color:#285d2a}
.answers button.wrong{background:#f2cfcc;color:#8a2922}
.feedback{text-align:center;min-height:30px;font-size:18px;font-weight:700;padding:9px 0 5px}
.next{width:100%;background:#222;color:white;margin-top:3px}
@media(max-width:500px){
  .answers{grid-template-columns:repeat(2,1fr)}
  .stats{gap:22px}
}
</style>
</head>
<body>
<div class="app">
  <h1>🎹 Maddy's Do-Re-Mi Trainer</h1>

  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="streak">0</b><small>streak</small></div>
      <div class="stat"><b id="accuracy">—</b><small>accuracy</small></div>
      <div class="stat"><b id="mastered">0/14</b><small>mastered</small></div>
    </div>

    <div class="progress"><div class="fill" id="fill"></div></div>

    <div class="staff" id="staff"></div>

    <div class="prompt">What is it?</div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next" style="display:none">Next note →</button>
    <div style="text-align:center;margin-top:8px">
      <button id="reset" type="button" style="background:transparent;font-size:12px;color:#777;padding:5px 8px">
        Reset progress
      </button>
    </div>
  </div>
</div>

<script>
"use strict";

const SOL = ["Do","Re","Mi","Fa","Sol","La","Ti"];
const STORAGE_KEY = "maddy-do-re-mi-trainer-v1";
const FAST_LIMIT = 1800; // milliseconds; used for mastery, not shown to Maddy

const blank = () => ({
  skill:{treble:Array(7).fill(0),bass:Array(7).fill(0)},
  misses:{treble:Array(7).fill(0),bass:Array(7).fill(0)},
  fast:{treble:Array(7).fill(0),bass:Array(7).fill(0)}
});

const state = {
  current:null, streak:0, correct:0, total:0,
  startedAt:0,
  ...blank()
};

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    streak:state.streak, correct:state.correct, total:state.total,
    skill:state.skill, misses:state.misses, fast:state.fast
  }));
}

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(!saved)return;
    state.streak=saved.streak||0;
    state.correct=saved.correct||0;
    state.total=saved.total||0;
    if(saved.skill)state.skill=saved.skill;
    if(saved.misses)state.misses=saved.misses;
    if(saved.fast)state.fast=saved.fast;
  }catch(e){}
}
load();

function cards(){
  const a=[];
  for(const staff of ["treble","bass"])
    for(let i=0;i<7;i++) a.push({staff,i});
  return a;
}

function choose(){
  const a=cards();
  const w=a.map(c=>
    1 +
    state.misses[c.staff][c.i]*5 +
    Math.max(0,4-state.skill[c.staff][c.i])*2 +
    Math.max(0,4-state.fast[c.staff][c.i])*2
  );
  let r=Math.random()*w.reduce((x,y)=>x+y,0);
  for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}
  return a[0];
}

/*
  True grand staff:
  - treble staff on top
  - bass staff below
  - visible gap between the two staffs
  - clefs placed at the left of their own staff
  - only ONE note is highlighted/played at a time
*/
function staffSvg(staff,i){
  /*
    TRUE GRAND STAFF:
      Treble staff = five lines, with its own vertical space.
      Bass staff   = five lines, with its own vertical space.
      A visible gap separates the two staves.
      The brace spans both staves, and each clef belongs to its own staff.
  */
  const treble = [42,52,62,72,82];
  const bass   = [116,126,136,146,156];

  // The seven notes are consecutive scale positions.
  // Treble: Mi = bottom line; Fa = space; Sol = line; La = space; Ti = line;
  //         Re and Do continue downward with ledger lines.
  // Bass:   Sol = top line; Fa = line below; Mi = space; Re = line; Do = space.
  const trebleY = 82 - (i-2)*5;
  const bassY   = 141 - i*5;
  const y = staff==="treble" ? trebleY : bassY;

  const lines = ys => ys.map(v =>
    `<line x1="150" y1="${v}" x2="685" y2="${v}"
           stroke="#222" stroke-width="2"/>`
  ).join("");

  let ledger = "";
  if(staff==="treble" && i<2){
    // Do and Re are below the treble staff.
    ledger = `<line x1="132" y1="${y}" x2="168" y2="${y}"
                    stroke="#222" stroke-width="2"/>`;
  }
  if(staff==="bass" && i>4){
    // La and Ti are above the bass staff.
    ledger = `<line x1="132" y1="${y}" x2="168" y2="${y}"
                    stroke="#222" stroke-width="2"/>`;
  }

  const note = `
    <ellipse cx="380" cy="${y}" rx="15" ry="10"
             fill="#222" transform="rotate(-18 380 ${y})"/>
    ${staff==="treble"
      ? `<line x1="394" y1="${y}" x2="394" y2="${y-43}"
               stroke="#222" stroke-width="3"/>`
      : `<line x1="366" y1="${y}" x2="366" y2="${y+43}"
               stroke="#222" stroke-width="3"/>`
    }`;

  return `<svg viewBox="0 0 720 190" aria-label="Grand staff">
    ${lines(treble)}
    ${lines(bass)}

    <!-- One treble clef, aligned with the treble staff -->
    <text x="67" y="79" font-size="78" font-family="serif">𝄞</text>

    <!-- One bass clef, aligned with the bass staff -->
    <text x="67" y="155" font-size="72" font-family="serif">𝄢</text>

    <!-- Grand-staff brace -->
    <path d="M45 35
             C27 43 27 58 43 76
             C28 91 28 107 43 123
             C27 141 27 158 45 164"
          fill="none" stroke="#333" stroke-width="3"/>

    ${ledger}
    ${note}
  </svg>`;
}
function renderStats(){
  document.getElementById("streak").textContent=state.streak;
  document.getElementById("accuracy").textContent=state.total
    ? Math.round(state.correct/state.total*100)+"%" : "—";

  let mastered=0;
  for(const staff of ["treble","bass"])
    for(let i=0;i<7;i++)
      if(state.skill[staff][i]>=4 && state.fast[staff][i]>=4) mastered++;

  document.getElementById("mastered").textContent=mastered+"/14";
  document.getElementById("fill").style.width=(mastered/14*100)+"%";
}

function next(){
  state.current=choose();
  document.getElementById("staff").innerHTML=staffSvg(
    state.current.staff,state.current.i
  );

  const choices=[...SOL];
  for(let j=choices.length-1;j>0;j--){
    const k=Math.floor(Math.random()*(j+1));
    [choices[j],choices[k]]=[choices[k],choices[j]];
  }
  document.getElementById("answers").innerHTML=choices.map(
    n=>`<button type="button" data-answer="${n}">${n}</button>`
  ).join("");
  state.startedAt=performance.now();

  document.querySelectorAll("#answers button").forEach(btn=>{
    btn.addEventListener("click",()=>answer(btn.dataset.answer));
  });

  document.getElementById("feedback").textContent="";
  document.getElementById("next").style.display="none";
  renderStats();
}

function answer(given){
  const target=SOL[state.current.i];
  const buttons=[...document.querySelectorAll("#answers button")];
  buttons.forEach(b=>b.disabled=true);

  state.total++;
  const responseMs=performance.now()-state.startedAt;

  if(given===target){
    state.correct++;
    state.streak++;
    state.skill[state.current.staff][state.current.i]=Math.min(
      4,state.skill[state.current.staff][state.current.i]+1
    );
    if(responseMs<=FAST_LIMIT){
      state.fast[state.current.staff][state.current.i]=Math.min(
        4,state.fast[state.current.staff][state.current.i]+1
      );
    }else{
      state.fast[state.current.staff][state.current.i]=Math.max(
        0,state.fast[state.current.staff][state.current.i]-1
      );
    }
    document.getElementById("feedback").innerHTML=`✓ <b>${target}</b>!`;
  }else{
    state.streak=0;
    state.misses[state.current.staff][state.current.i]++;
    state.skill[state.current.staff][state.current.i]=Math.max(
      0,state.skill[state.current.staff][state.current.i]-1
    );
    state.fast[state.current.staff][state.current.i]=0;
    document.getElementById("feedback").innerHTML=
      `Not quite — it was <b>${target}</b>.`;
  }

  buttons.forEach(b=>{
    if(b.dataset.answer===target)b.classList.add("correct");
    if(b.dataset.answer===given && given!==target)b.classList.add("wrong");
  });

  document.getElementById("next").style.display="block";
  save();
  renderStats();
}

document.getElementById("next").addEventListener("click",next);
document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("Reset Maddy's practice progress?")){
    localStorage.removeItem(STORAGE_KEY);
    state.streak=state.correct=state.total=0;
    const fresh=blank();
    state.skill=fresh.skill; state.misses=fresh.misses; state.fast=fresh.fast;
    next();
  }
});
next();
</script>
</body>
</html>
