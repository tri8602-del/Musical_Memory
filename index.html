<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maddy's Do-Re-Mi Trainer</title><style>
:root{
  --ink:#302b3d;
  --muted:#7b7488;
  --purple:#7357d9;
  --purple-dark:#5d43bc;
  --lavender:#eee9ff;
  --peach:#ffe6dc;
  --mint:#dcf4e6;
  --rose:#ffdede;
  --paper:#fffdfb;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 8%, #eee8ff 0 9%, transparent 24%),
    radial-gradient(circle at 94% 15%, #ffe9df 0 8%, transparent 23%),
    linear-gradient(145deg,#f8f6ff,#fffaf6);
  -webkit-tap-highlight-color:transparent;
}
.app{width:min(760px,100%);margin:auto;padding:22px 16px 28px}
h1{
  text-align:center;
  font-size:clamp(27px,6vw,36px);
  line-height:1.12;
  margin:3px 0 16px;
  letter-spacing:-.7px;
  color:#332c47;
}
h1::before{content:"♪  ";color:var(--purple)}
h1::after{content:"  ♫";color:#f08a68}
.panel{
  position:relative;
  background:rgba(255,253,251,.94);
  border:2px solid rgba(115,87,217,.12);
  border-radius:28px;
  padding:17px;
  box-shadow:0 14px 38px rgba(73,55,126,.12);
  overflow:hidden;
}
.panel::before{
  content:"";
  position:absolute;
  width:130px;height:130px;
  right:-70px;top:-70px;
  border-radius:50%;
  background:var(--lavender);
  opacity:.7;
}
.stats{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:center;
  gap:10px;
  margin:0 0 13px;
}
.stat{
  min-width:105px;
  background:#f5f2ff;
  border:1px solid #e5defd;
  border-radius:17px;
  padding:8px 13px 7px;
  text-align:center;
}
.stat:nth-child(2){background:#fff3ee;border-color:#ffe2d7}
.stat:nth-child(3){background:#eef9f2;border-color:#d9f0e1}
.stat b{
  display:block;
  font-size:23px;
  line-height:1.05;
  color:#4b3c78;
}
.stat small{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.progress{
  position:relative;
  height:9px;
  background:#eeeaf5;
  border-radius:99px;
  overflow:hidden;
  margin:2px 3px 14px;
}
.fill{
  height:100%;
  width:0;
  border-radius:99px;
  background:linear-gradient(90deg,#8065e5,#f28c72);
  transition:width .3s ease;
}
.note-card{
  position:relative;
  border:2px solid #e7e1ef;
  border-radius:20px;
  background:white;
  padding:0;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(60,45,90,.06);
}
.note-card img{display:block;width:100%;height:auto}
.prompt{
  text-align:center;
  font-size:21px;
  font-weight:800;
  margin:14px 0 11px;
  color:#393147;
}
.answers{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
button{
  border:0;
  border-radius:16px;
  padding:14px 8px;
  font-size:18px;
  font-weight:800;
  color:#3e3651;
  background:#f0edf7;
  box-shadow:inset 0 -2px 0 rgba(70,55,100,.08);
  touch-action:manipulation;
  transition:transform .08s,background .15s,box-shadow .15s;
}
.answers button{
  background:linear-gradient(#f7f5fb,#eeeaf7);
  border:1px solid #e1dced;
}
button:active{transform:translateY(1px) scale(.98)}
button:disabled{opacity:1}
.answers button.correct{
  background:var(--mint);
  border-color:#bfe5cc;
  color:#287044;
}
.answers button.wrong{
  background:var(--rose);
  border-color:#f2c4c4;
  color:#a13e3e;
}
.feedback{
  text-align:center;
  min-height:34px;
  font-size:18px;
  font-weight:750;
  padding:9px 0 5px;
  color:#4a4257;
}
.next{
  width:100%;
  margin-top:3px;
  color:white;
  background:linear-gradient(135deg,var(--purple),#9279ea);
  box-shadow:0 5px 12px rgba(115,87,217,.22);
}
.reset{
  display:block;
  margin:10px auto 0;
  background:transparent;
  box-shadow:none;
  color:#918a9c;
  font-size:12px;
  font-weight:600;
  padding:5px 8px;
}
@media(max-width:560px){
  .app{padding:15px 10px 22px}
  .panel{padding:12px;border-radius:23px}
  .stats{gap:6px}
  .stat{min-width:0;flex:1;padding:8px 5px}
  .stat b{font-size:21px}
  .answers{grid-template-columns:repeat(2,1fr);gap:9px}
}

.mnemonic{
  margin-top:4px;
  color:#7357d9;
  font-size:17px;
  font-weight:900;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.feedback-result{font-size:18px;font-weight:800}
.correct-result{color:#287044}
.wrong-result{color:#a13e3e}
.correct-answer{font-size:18px;font-weight:800;margin-top:3px;color:#4a4257}
.mnemonic{font-size:15px;margin-top:5px;color:#7357d9;font-weight:800;letter-spacing:.3px;text-transform:uppercase}

/* Responsive layout: landscape gets a side-by-side workspace; portrait stays
   intentionally simple. Uses dynamic viewport units so browser chrome is
   accounted for on phones/tablets. */
html,body{width:100%;min-height:100%;overflow-x:hidden}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

@media (min-width:700px) and (orientation:landscape){
  body{min-height:100dvh}
  .app{
    width:min(1200px,calc(100vw - 24px));
    height:100dvh;
    min-height:0;
    padding:8px 12px 12px;
    display:flex;
    flex-direction:column;
  }
  h1{
    flex:0 0 auto;
    font-size:clamp(25px,3vw,34px);
    margin:0 0 7px;
  }
  .panel{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);
    grid-template-rows:auto auto minmax(0,1fr) auto auto;
    column-gap:18px;
    row-gap:0;
    padding:12px 14px;
  }
  .stats{grid-column:1 / -1;grid-row:1;margin:0 0 7px}
  .progress{grid-column:1 / -1;grid-row:2;margin:0 3px 8px}
  .note-card{
    grid-column:1;
    grid-row:3 / 6;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .note-card img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .prompt{
    grid-column:2;
    grid-row:3;
    align-self:end;
    margin:0 0 8px;
    font-size:clamp(18px,2vw,22px);
  }
  .answers{
    grid-column:2;
    grid-row:4;
    align-self:center;
    gap:8px;
  }
  .answers button{padding:12px 7px;font-size:17px}
  .feedback{
    grid-column:2;
    grid-row:5;
    min-height:0;
    padding:6px 0 2px;
    align-self:start;
  }
  .next{
    grid-column:2;
    grid-row:6;
    margin-top:4px;
  }
  .reset{
    grid-column:2;
    grid-row:7;
    margin:3px auto 0;
  }
}

/* Short landscape screens (laptops and phones in landscape). */
@media (min-width:700px) and (orientation:landscape) and (max-height:700px){
  .app{padding-top:4px;padding-bottom:7px}
  h1{font-size:25px;margin-bottom:4px}
  .panel{padding:8px 10px;column-gap:12px}
  .stats{gap:7px;margin-bottom:4px}
  .stat{padding:5px 9px}
  .stat b{font-size:19px}
  .progress{height:7px;margin-bottom:5px}
  .prompt{font-size:18px;margin-bottom:5px}
  .answers{gap:6px}
  .answers button{padding:9px 5px;font-size:15px}
  .feedback{font-size:15px;padding:3px 0 0}
  .feedback-result,.correct-answer{font-size:15px}
  .mnemonic{font-size:13px}
  .next{padding:9px 8px;font-size:16px}
  .reset{font-size:11px;padding:2px 6px}
}

/* Keep the portrait phone layout comfortably inside the safe area so the
   bottom browser gesture/menu doesn't sit underneath the Next button. */
@media (max-width:560px) and (orientation:portrait){
  .app{
    width:100%;
    min-height:100dvh;
    padding:
      max(8px,env(safe-area-inset-top))
      8px
      max(28px,calc(24px + env(safe-area-inset-bottom)));
  }
  h1{font-size:clamp(23px,7vw,29px);margin:0 0 9px}
  .panel{padding:10px;border-radius:21px}
  .note-card{border-radius:17px}
  .prompt{font-size:19px;margin:10px 0 8px}
  .answers{gap:7px}
  .answers button{padding:11px 6px;font-size:17px;min-height:48px}
  .feedback{font-size:16px;padding:7px 0 4px}
  .feedback-result,.correct-answer{font-size:16px}
  .mnemonic{font-size:13px;letter-spacing:.9px}
  .next{margin-top:2px;min-height:48px}
  .reset{margin:7px auto 0}
}

/* Very short portrait screens: trim decorative spacing rather than forcing
   the user to scroll to reach Next. */
@media (max-width:560px) and (orientation:portrait) and (max-height:700px){
  h1{font-size:23px;margin-bottom:6px}
  .panel{padding:8px}
  .stats{margin-bottom:7px}
  .stat{padding:6px 4px}
  .stat b{font-size:19px}
  .progress{height:7px;margin-bottom:8px}
  .prompt{margin:7px 0 6px;font-size:18px}
  .answers{gap:6px}
  .answers button{min-height:44px;padding:8px 5px;font-size:16px}
  .feedback{padding:5px 0 2px}
  .next{min-height:44px}
}

const FAST_LIMIT=1800;
const STORAGE_KEY="maddy-do-re-mi-trainer-v2-23cards";

const state={
  current:null,streak:0,correct:0,total:0,startedAt:0,
  skill:Array(CARDS.length).fill(0),
  misses:Array(CARDS.length).fill(0),
  fast:Array(CARDS.length).fill(0)
};

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify({
    streak:state.streak,correct:state.correct,total:state.total,
    skill:state.skill,misses:state.misses,fast:state.fast
  }));
}

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(!s)return;
    state.streak=s.streak||0;
    state.correct=s.correct||0;
    state.total=s.total||0;
    if(Array.isArray(s.skill)&&s.skill.length===CARDS.length)state.skill=s.skill;
    if(Array.isArray(s.misses)&&s.misses.length===CARDS.length)state.misses=s.misses;
    if(Array.isArray(s.fast)&&s.fast.length===CARDS.length)state.fast=s.fast;
  }catch(e){}
}
load();

function choose(){
  const weights=CARDS.map((c,i)=>
    1+state.misses[i]*5+
    Math.max(0,4-state.skill[i])*2+
    Math.max(0,4-state.fast[i])*2
  );
  let r=Math.random()*weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<CARDS.length;i++){
    r-=weights[i];
    if(r<=0)return i;
  }
  return 0;
}

function renderStats(){
  document.getElementById("streak").textContent=state.streak;
  document.getElementById("accuracy").textContent=
    state.total?Math.round(state.correct/state.total*100)+"%":"—";
  let mastered=0;
  for(let i=0;i<CARDS.length;i++)
    if(state.skill[i]>=4&&state.fast[i]>=4)mastered++;
  document.getElementById("mastered").textContent=mastered+"/23";
  document.getElementById("fill").style.width=(mastered/23*100)+"%";
}

function next(){
  state.current=choose();
  const card=CARDS[state.current];

  document.getElementById("staff").innerHTML=
    '<img alt="Music staff note" src="data:image/png;base64,'+
    IMG[card.image]+'">';

  const choices=[...new Set(CARDS.map(c=>c.sol))];
  for(let j=choices.length-1;j>0;j--){
    const k=Math.floor(Math.random()*(j+1));
    [choices[j],choices[k]]=[choices[k],choices[j]];
  }

  document.getElementById("answers").innerHTML=choices.map(n=>
    `<button type="button" data-answer="${n}">${n}</button>`
  ).join("");

  document.querySelectorAll("#answers button").forEach(b=>
    b.addEventListener("click",()=>answer(b.dataset.answer))
  );

  document.getElementById("feedback").textContent="";
  document.getElementById("next").style.display="none";
  state.startedAt=performance.now();
  renderStats();
}

let audioCtx=null;
function getAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}
function playCorrectNote(card){
  const ctx=getAudio(); if(!ctx)return;
  const freq=440*Math.pow(2,(card.midi-69)/12), now=ctx.currentTime;
  const master=ctx.createGain();
  master.gain.setValueAtTime(0.0001,now);
  master.gain.exponentialRampToValueAtTime(0.24,now+0.012);
  master.gain.exponentialRampToValueAtTime(0.09,now+0.18);
  master.gain.exponentialRampToValueAtTime(0.0001,now+0.95);
  master.connect(ctx.destination);
  [[1,0.85],[2,0.18],[3,0.07],[4,0.03]].forEach(([m,l])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine"; o.frequency.value=freq*m; g.gain.value=l;
    o.connect(g);g.connect(master);o.start(now);o.stop(now+1.0);
  });
}
function playMissSound(){
  const ctx=getAudio(); if(!ctx)return;
  const now=ctx.currentTime,g=ctx.createGain(),o=ctx.createOscillator();
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.16,now+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.20);
  g.connect(ctx.destination);
  o.type="square";
  o.frequency.setValueAtTime(180,now);
  o.frequency.exponentialRampToValueAtTime(95,now+0.18);
  o.connect(g);o.start(now);o.stop(now+0.21);
}
function answer(given){
  const card=CARDS[state.current], target=card.sol;
  const buttons=[...document.querySelectorAll("#answers button")];
  buttons.forEach(b=>b.disabled=true);
  state.total++;
  const responseMs=performance.now()-state.startedAt;
  const isCorrect=given===target;

  if(isCorrect){
    state.correct++; state.streak++;
    state.skill[state.current]=Math.min(4,state.skill[state.current]+1);
    if(responseMs<=FAST_LIMIT)
      state.fast[state.current]=Math.min(4,state.fast[state.current]+1);
    else
      state.fast[state.current]=Math.max(0,state.fast[state.current]-1);

    playCorrectNote(card);
    document.getElementById("feedback").innerHTML=
      `<div class="feedback-result correct-result">✓ <b>${target}!</b></div>`+
      `<div class="mnemonic">${card.mnemonic}</div>`;
  }else{
    state.streak=0;
    state.misses[state.current]++;
    state.skill[state.current]=Math.max(0,state.skill[state.current]-1);
    state.fast[state.current]=0;

    playMissSound();
    setTimeout(()=>playCorrectNote(card),250);

    document.getElementById("feedback").innerHTML=
      `<div class="feedback-result wrong-result">Not quite — you chose <b>${given}</b>.</div>`+
      `<div class="correct-answer">The note is <b>${target}</b>.</div>`+
      `<div class="mnemonic">${card.mnemonic}</div>`;
  }

  buttons.forEach(b=>{
    if(b.dataset.answer===target)b.classList.add("correct");
    if(b.dataset.answer===given&&given!==target)b.classList.add("wrong");
  });
  document.getElementById("next").style.display="block";
  save(); renderStats();
}
document.getElementById("next").addEventListener("click",next);

document.getElementById("reset").addEventListener("click",()=>{
  if(confirm("Reset Maddy's practice progress?")){
    localStorage.removeItem(STORAGE_KEY);
    state.streak=0;state.correct=0;state.total=0;
    state.skill=Array(CARDS.length).fill(0);
    state.misses=Array(CARDS.length).fill(0);
    state.fast=Array(CARDS.length).fill(0);
    next();
  }
});

next();
</script></body></html>
